# TechD DSPM Helm Values

replicaCount:
  backend: 3
  worker: 4
  frontend: 2

image:
  backend:
    repository: techd/dspm-backend
    tag: latest
    pullPolicy: IfNotPresent
  worker:
    repository: techd/dspm-worker
    tag: latest
    pullPolicy: IfNotPresent
  frontend:
    repository: techd/dspm-frontend
    tag: latest
    pullPolicy: IfNotPresent

service:
  backend:
    type: ClusterIP
    port: 8000
  frontend:
    type: ClusterIP
    port: 3000

ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
  hosts:
    - host: dspm.techd.com
      paths:
        - path: /
          pathType: Prefix
          service: frontend
    - host: api.dspm.techd.com
      paths:
        - path: /
          pathType: Prefix
          service: backend
  tls:
    - secretName: dspm-tls
      hosts:
        - dspm.techd.com
        - api.dspm.techd.com

resources:
  backend:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi
  worker:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: "2"
      memory: 2Gi
  frontend:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

autoscaling:
  worker:
    enabled: true
    minReplicas: 2
    maxReplicas: 20
    targetCPUUtilization: 70

postgresql:
  enabled: true
  auth:
    database: dspm
    username: dspm

redis:
  enabled: true
  architecture: standalone

elasticsearch:
  enabled: true
  replicas: 1
  minimumMasterNodes: 1
