version: "3.9"

services:
  # ═══════════════════════════════════════════════════════════════════════
  # Infrastructure
  # ═══════════════════════════════════════════════════════════════════════

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: privacyops
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme_postgres}
      POSTGRES_MULTIPLE_DATABASES: privacyops_auth,privacyops_audit,privacyops_notifications,privacyops_workflows,privacyops_dspm
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./docker/init-multiple-dbs.sh:/docker-entrypoint-initdb.d/init-multiple-dbs.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U privacyops"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-changeme_redis}
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    ports:
      - "127.0.0.1:6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-changeme_redis}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  opensearch:
    image: opensearchproject/opensearch:2.12.0
    environment:
      - discovery.type=single-node
      - plugins.security.disabled=true
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "127.0.0.1:9201:9200"
    volumes:
      - os_data:/usr/share/opensearch/data

  kafka:
    image: bitnami/kafka:3.7
    environment:
      - KAFKA_CFG_NODE_ID=0
      - KAFKA_CFG_PROCESS_ROLES=controller,broker
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=0@kafka:9093
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE=true
    ports:
      - "127.0.0.1:9094:9094"
    volumes:
      - kafka_data:/bitnami/kafka

  # ═══════════════════════════════════════════════════════════════════════
  # Shared Platform Services
  # ═══════════════════════════════════════════════════════════════════════

  auth-service:
    build:
      context: ./services/auth-service
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:3001:3001"
    environment:
      PORT: 3001
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: privacyops
      DB_PASSWORD: ${POSTGRES_PASSWORD:-changeme_postgres}
      DB_DATABASE: privacyops_auth
      DB_SYNCHRONIZE: "true"
      JWT_SECRET: ${JWT_SECRET:-change-this-super-secret-key-in-production}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-change-this-refresh-secret-key}
      JWT_ACCESS_TOKEN_EXPIRES_IN: "15m"
      JWT_REFRESH_TOKEN_EXPIRES_IN: "7d"
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-changeme_redis}
      KAFKA_BROKERS: kafka:9092
      CORS_ORIGINS: "http://localhost:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  audit-ledger-service:
    build:
      context: ./services/audit-ledger-service
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:3002:3002"
    environment:
      PORT: 3002
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: privacyops
      DB_PASSWORD: ${POSTGRES_PASSWORD:-changeme_postgres}
      DB_DATABASE: privacyops_audit
      DB_SYNCHRONIZE: "true"
      OPENSEARCH_NODE: http://opensearch:9200
      KAFKA_BROKERS: kafka:9092
    depends_on:
      postgres:
        condition: service_healthy

  notification-service:
    build:
      context: ./services/notification-service
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:3003:3003"
    environment:
      PORT: 3003
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: privacyops
      DB_PASSWORD: ${POSTGRES_PASSWORD:-changeme_postgres}
      DB_DATABASE: privacyops_notifications
      DB_SYNCHRONIZE: "true"
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-changeme_redis}
      KAFKA_BROKERS: kafka:9092
      SMTP_HOST: ${SMTP_HOST:-mailhog}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_FROM: ${SMTP_FROM:-noreply@privacyops.local}
    depends_on:
      postgres:
        condition: service_healthy

  workflow-engine:
    build:
      context: ./services/workflow-engine
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:3004:3004"
    environment:
      PORT: 3004
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: privacyops
      DB_PASSWORD: ${POSTGRES_PASSWORD:-changeme_postgres}
      DB_DATABASE: privacyops_workflows
      DB_SYNCHRONIZE: "true"
      KAFKA_BROKERS: kafka:9092
    depends_on:
      postgres:
        condition: service_healthy

  dspm-adapter-service:
    build:
      context: ./services/dspm-adapter-service
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:3005:3005"
    environment:
      PORT: 3005
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: privacyops
      DB_PASSWORD: ${POSTGRES_PASSWORD:-changeme_postgres}
      DB_DATABASE: privacyops_dspm
      DB_SYNCHRONIZE: "true"
      DSPM_API_URL: http://host.docker.internal:8000/api/v1
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-changeme_redis}
      KAFKA_BROKERS: kafka:9092
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pg_data:
  os_data:
  kafka_data:
